<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a73e8">
  <meta name="description" content="シンプルな乗換案内アプリ">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" href="./images/app-icon-192.png">
  <link rel="apple-touch-icon" href="./images/app-icon-192.png">
  <title>電車乗換案内</title>
</head>
<body>
  <div class="app">
    <!-- ヘッダー -->
    <header class="header">
      <h1>電車乗換案内</h1>
    </header>

    <!-- タブナビゲーション -->
    <nav class="tabs" role="tablist" aria-label="機能切り替え">
      <button
        id="tab-route"
        class="tab active"
        role="tab"
        aria-selected="true"
        aria-controls="panel-route"
      >乗換検索</button>
      <button
        id="tab-timetable"
        class="tab"
        role="tab"
        aria-selected="false"
        aria-controls="panel-timetable"
      >時刻表</button>
      <button
        id="tab-traininfo"
        class="tab"
        role="tab"
        aria-selected="false"
        aria-controls="panel-traininfo"
      >運行情報</button>
    </nav>

    <!-- メインコンテンツ -->
    <main class="main">
      <!-- 乗換検索パネル -->
      <div id="panel-route" class="panel" role="tabpanel" aria-labelledby="tab-route">
        <form id="search-form" class="search-card" role="search" aria-label="乗換検索">
        <div class="input-group">
          <label for="departure" id="departure-label">出発駅</label>
          <input
            type="text"
            id="departure"
            placeholder="駅名を入力"
            autocomplete="off"
            aria-labelledby="departure-label"
            aria-autocomplete="list"
            aria-controls="departure-suggestions"
            aria-expanded="false"
            role="combobox"
          >
          <ul
            id="departure-suggestions"
            class="suggestions"
            role="listbox"
            aria-label="出発駅の候補"
          ></ul>
        </div>

        <button
          type="button"
          id="swap-btn"
          class="swap-btn"
          title="出発と到着を入れ替え"
          aria-label="出発駅と到着駅を入れ替え"
        >
          <span aria-hidden="true">&#8693;</span>
        </button>

        <div class="input-group">
          <label for="arrival" id="arrival-label">到着駅</label>
          <input
            type="text"
            id="arrival"
            placeholder="駅名を入力"
            autocomplete="off"
            aria-labelledby="arrival-label"
            aria-autocomplete="list"
            aria-controls="arrival-suggestions"
            aria-expanded="false"
            role="combobox"
          >
          <ul
            id="arrival-suggestions"
            class="suggestions"
            role="listbox"
            aria-label="到着駅の候補"
          ></ul>
        </div>

        <fieldset class="time-options">
          <legend class="visually-hidden">時刻指定オプション</legend>
          <div class="time-type" role="radiogroup" aria-label="時刻タイプ">
            <label>
              <input type="radio" name="time-type" value="departure" checked>
              出発時刻
            </label>
            <label>
              <input type="radio" name="time-type" value="arrival">
              到着時刻
            </label>
          </div>
          <div class="time-input">
            <input
              type="datetime-local"
              id="datetime"
              aria-label="日時を選択"
            >
            <button
              type="button"
              id="now-btn"
              class="now-btn"
              aria-label="現在時刻を設定"
            >現在時刻</button>
          </div>
        </fieldset>

        <button type="submit" id="search-btn" class="search-btn">検索</button>
      </form>

      <!-- 検索結果 -->
      <section
        id="results"
        class="results"
        role="region"
        aria-label="検索結果"
        aria-live="polite"
      ></section>

      <!-- ローディング -->
      <div id="loading" class="loading hidden" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>検索中...</p>
      </div>

      <!-- エラーメッセージ -->
      <div
        id="error"
        class="error hidden"
        role="alert"
        aria-live="assertive"
      ></div>
      </div><!-- /panel-route -->

      <!-- 時刻表パネル -->
      <div id="panel-timetable" class="panel hidden" role="tabpanel" aria-labelledby="tab-timetable">
        <div class="search-card">
          <div class="input-group">
            <label for="railway-select" id="railway-label">路線を選択</label>
            <select
              id="railway-select"
              aria-labelledby="railway-label"
            >
              <option value="">路線を選択してください</option>
            </select>
          </div>

          <div class="input-group">
            <label for="station-select" id="station-label">駅を選択</label>
            <select
              id="station-select"
              aria-labelledby="station-label"
              disabled
            >
              <option value="">駅を選択してください</option>
            </select>
          </div>

          <div class="calendar-tabs" role="tablist" aria-label="曜日選択">
            <button type="button" class="calendar-tab active" data-calendar="weekday" role="tab" aria-selected="true">平日</button>
            <button type="button" class="calendar-tab" data-calendar="saturday" role="tab" aria-selected="false">土曜</button>
            <button type="button" class="calendar-tab" data-calendar="holiday" role="tab" aria-selected="false">休日</button>
          </div>

          <button type="button" id="timetable-btn" class="search-btn" disabled>時刻表を表示</button>
        </div>

        <!-- 時刻表表示エリア -->
        <section
          id="timetable-results"
          class="timetable-results"
          role="region"
          aria-label="時刻表"
          aria-live="polite"
        ></section>

        <div id="timetable-loading" class="loading hidden" role="status" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <p>読み込み中...</p>
        </div>
      </div><!-- /panel-timetable -->

      <!-- 運行情報パネル -->
      <div id="panel-traininfo" class="panel hidden" role="tabpanel" aria-labelledby="tab-traininfo">
        <div class="search-card">
          <p class="info-text">首都圏の鉄道運行情報をリアルタイムで表示します。</p>
          <button type="button" id="traininfo-btn" class="search-btn">運行情報を取得</button>
        </div>

        <!-- 運行情報表示エリア -->
        <section
          id="traininfo-results"
          class="traininfo-results"
          role="region"
          aria-label="運行情報"
          aria-live="polite"
        ></section>

        <div id="traininfo-loading" class="loading hidden" role="status" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <p>読み込み中...</p>
        </div>
      </div><!-- /panel-traininfo -->
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>Powered by Google Maps API & ODPT</p>
    </footer>
  </div>

  <script src="./js/odpt-data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
